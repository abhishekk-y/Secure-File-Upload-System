services:
  vault:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - vault-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
volumes:
  vault-data:
